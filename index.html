<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restaurant Menu</title><link rel="stylesheet" href="assets/css/style.css"></head><body>
<div id="app" class="customer"><div class="ctop"><img id="restaurantLogo" alt="Restaurant" style="max-width:230px;max-height:125px;width:auto;height:auto;object-fit:contain;margin:0 auto 8px"><div id="restaurantName" style="font-size:20px;font-weight:900;color:#f2cb68"></div><div id="table">Loading table…</div></div><div id="menu">Loading menu…</div><div class="cartbar"><span>Cart: <b id="count">0</b> &nbsp; Total: <b id="currencySymbol"></b><b id="total">0.00</b></span><button class="btn gold" onclick="openCart()">View Cart</button></div></div>
<div class="modal" id="cartModal"><div><h2>Your Order</h2><div id="cartList"></div><label>Special instructions (optional)</label><textarea id="notes" rows="3" placeholder="e.g. No onion"></textarea><div style="display:flex;justify-content:space-between;margin:16px 0;font-size:19px"><b>Total</b><b><span id="currencySymbol2"></span><span id="cartTotal">0.00</span></b></div><button class="btn" style="width:100%" onclick="submitOrder()">PLACE ORDER</button><button class="btn light" style="width:100%;margin-top:8px" onclick="closeCart()">Continue ordering</button></div></div>
<script src="assets/js/customer.js"></script></body></html>
